[program:laracsms-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/cgs.syncbas.my.id/laraCSMS/artisan queue:work --sleep=0 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=2
redirect_stderr=true
stdout_logfile=/www/wwwroot/cgs.syncbas.my.id/laraCSMS/storage/logs/queue-worker.log
stopwaitsecs=3600
